<script data-field-replace>
(function(){
  var params=new URLSearchParams(window.location.search);
  var fields={};
  var paramMap={
    'first_name':'firstName','last_name':'lastName','full_name':'fullName',
    'email':'email','phone':'phone','company':'company',
    'city':'city','state':'state','country':'country'
  };
  var skipTags={'SCRIPT':1,'STYLE':1,'NOSCRIPT':1,'TEXTAREA':1,'CODE':1,'PRE':1};
  var hasUrlFields=false;
  for(var p in paramMap){
    var v=params.get(p);
    if(v){fields[paramMap[p]]=v;hasUrlFields=true;}
  }
  var contactId=params.get('contact_id');
  function esc(s){
    if(!s)return s;
    var d=document.createElement('div');
    d.appendChild(document.createTextNode(s));
    return d.innerHTML;
  }
  function doReplace(data){
    var r={};
    r['{{full_name}}']=esc(((data.firstName||'')+' '+(data.lastName||'')).trim()||((data.fullName||data.name)||''));
    r['{{first_name}}']=esc(data.firstName||(data.name?data.name.split(' ')[0]:'')||'');
    r['{{last_name}}']=esc(data.lastName||(data.name&&data.name.indexOf(' ')>-1?data.name.substring(data.name.indexOf(' ')+1):'')||'');
    r['{{email}}']=esc(data.email||'');
    r['{{phone}}']=esc(data.phone||'');
    r['{{company}}']=esc(data.company||'');
    r['{{city}}']=esc(data.city||'');
    r['{{state}}']=esc(data.state||'');
    r['{{country}}']=esc(data.country||'');
    r['{{date}}']=new Date().toLocaleDateString();
    r['{{time}}']=new Date().toLocaleTimeString();
    r['{{location}}']=[data.city,data.state,data.country].filter(Boolean).join(', ');
    r['{{tracking_id}}']=esc(data.trackingId||'');
    r['{{lastClickedProduct}}']=esc(data.lastClickedProduct||'');
    r['{{lastProductClickDate}}']=esc(data.lastProductClickDate||'');
    r['{{lastClickedProductPrice}}']=esc(data.lastClickedProductPrice||'');
    r['{{lastClickedProductURL}}']=esc(data.lastClickedProductURL||'');
    r['{{productsClickedCount}}']=esc(data.productsClickedCount||'0');
    r['{{ip_address}}']=esc(data.ipAddress||'');
    r['{{ip}}']=esc(data.ipAddress||'');
    if(data.customFields){
      for(var k in data.customFields){
        r['{{'+k+'}}']=esc(String(data.customFields[k]||''));
      }
    }
    params.forEach(function(v,k){
      if(!paramMap[k]&&k!=='contact_id'&&k!=='page_id'&&k.indexOf('utm_')!==0){
        r['{{'+k+'}}']=esc(v);
      }
    });
    var hasValues=false;
    for(var key in r){if(r[key]){hasValues=true;break;}}
    if(!hasValues)return;
    var walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,{
      acceptNode:function(n){
        var p=n.parentNode;
        if(p&&skipTags[p.nodeName])return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    var node;
    while(node=walker.nextNode()){
      var txt=node.nodeValue;
      if(txt&&txt.indexOf('{{')>-1){
        var changed=txt;
        for(var ph in r){
          if(r[ph]&&changed.indexOf(ph)>-1){
            changed=changed.split(ph).join(r[ph]);
          }
        }
        if(changed!==txt)node.nodeValue=changed;
      }
    }
    var attrs=['value','placeholder','content','alt','title'];
    attrs.forEach(function(attr){
      var els=document.querySelectorAll('['+attr+'*="{{"]');
      for(var i=0;i<els.length;i++){
        var tag=els[i].tagName;
        if(skipTags[tag])continue;
        var val=els[i].getAttribute(attr);
        if(val){
          var nv=val;
          for(var ph in r){
            if(r[ph]&&nv.indexOf(ph)>-1){
              nv=nv.split(ph).join(r[ph]);
            }
          }
          if(nv!==val)els[i].setAttribute(attr,nv);
        }
      }
    });
  }
  function run(){
    if(contactId){
      var xhr=new XMLHttpRequest();
      xhr.open('GET','https://paymegpt.com/api/landing/context/'+encodeURIComponent(contactId)+'?page_id=5617');
      xhr.onload=function(){
        if(xhr.status===200){
          try{
            var resp=JSON.parse(xhr.responseText);
            if(resp.success&&resp.contact){
              var merged=resp.contact;
              for(var k in fields){merged[k]=fields[k];}
              doReplace(merged);
              return;
            }
          }catch(e){}
        }
        if(hasUrlFields)doReplace(fields);
      };
      xhr.onerror=function(){if(hasUrlFields)doReplace(fields);};
      xhr.send();
    }else if(hasUrlFields){
      doReplace(fields);
    }
  }
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',run);}
  else{run();}
})();
</script>

    <script>
      (() => {
        // ─── CONFIGURATION ──────────────────────────────────────────────────────
        const MAIN_LANDING_URL = 'https://paymegpt.com/p/6B5TZWXE';
        const HUB_URL = 'https://paymegpt.com/p/Bjs45P';
        const TRANSITION_DELAY_MS = 1200;

        const ISO_NOW = () => new Date().toISOString();
        const source = new URLSearchParams(window.location.search).get('source');
        const isRegistration = source === 'registration';

        // After registration: go back to MAIN LANDING PAGE (not Hub)
        // This lets PMG's 30-day memory recognize the user on Sign In
        // so the Hub doesn't show a second PIN gate
        const destinationUrl = isRegistration ? MAIN_LANDING_URL : HUB_URL;
        const fallbackLabel = isRegistration ? 'Return to IMAGO Companion' : 'Continue to My IMAGO Journey';

        // Set fallback link
        const fallbackLinkWrap = document.getElementById('fallback-link-wrap');
        const fallbackLink = fallbackLinkWrap?.querySelector('a');
        if (fallbackLink) {
          fallbackLink.href = destinationUrl;
          fallbackLink.textContent = fallbackLabel;
        }

        let redirected = false;
        const redirectNow = () => {
          if (redirected) return;
          redirected = true;
          window.location.assign(destinationUrl);
        };

        const redirectAfterBriefTransition = () => {
          if (redirected) return;
          redirected = true;
          window.setTimeout(() => window.location.assign(destinationUrl), TRANSITION_DELAY_MS);
        };

        // Auto-redirect after a brief success animation
        redirectAfterBriefTransition();

        // ─── UPDATE SHEET ROW WITH VERIFICATION STATUS ──────────────────────────
        // This updates the profile/account row to mark email_verified and set status to Active
        const sheetDataUrl = 'https://paymegpt.com/api/public/landing-pages/5617/sheet-data';
        const sheetRowsUrl = 'https://paymegpt.com/api/public/landing-pages/5617/sheet-rows';

        const attemptSheetUpdate = async () => {
          try {
            // Fetch the current row (filtered server-side by verified email)
            const dataRes = await fetch(sheetDataUrl, { method: 'GET', credentials: 'include' });
            if (!dataRes.ok) throw new Error(`Sheet data request failed with ${dataRes.status}`);
            
            const payload = await dataRes.json();
            const rows = Array.isArray(payload) ? payload : (payload.rows || payload.data || []);

            if (rows.length !== 1) {
              console.log('[Auth] No or multiple rows returned; skipping sheet update.');
              return;
            }

            const row = rows[0];
            const rowId = row.rowNumber ?? row._rowNumber ?? row.row_number ?? row.sheetRowNumber ?? null;

            if (!rowId) {
              console.log('[Auth] Row returned but no stable row ID; skipping update.');
              return;
            }

            // PATCH the row to mark as verified and active
            const timestamp = ISO_NOW();
            const patchBody = {
              email_verified: 'Yes',
              email_verified_date: timestamp,
              account_status: 'Active',
              last_login: timestamp
            };

            const patchUrl = sheetRowsUrl.replace(/\/$/, '') + '/' + encodeURIComponent(String(rowId));
            const patchRes = await fetch(patchUrl, {
              method: 'PATCH',
              credentials: 'include',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(patchBody)
            });

            if (!patchRes.ok) {
              console.warn('[Auth] Sheet row patch returned', patchRes.status);
              return;
            }

            console.log('[Auth] Sheet row updated successfully.');
          } catch (error) {
            console.warn('[Auth] Sheet update error (non-fatal):', error);
          }
        };

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', attemptSheetUpdate, { once: true });
        } else {
          attemptSheetUpdate();
        }
      })();
    </script>
